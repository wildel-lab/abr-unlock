<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>ABR Unlock</title>
<style>
:root{
  --bg:#f5f4f0;--card:#fff;--ink:#1c1b19;--muted:#6a6963;--line:#e2e0d8;--chip:#ecebe5;
  --accent:#0f6e56;--accent-ink:#fff;--accent-soft:#e1f2eb;
  --ok:#1d6b35;--ok-bg:#e5f3e8;--bad:#a12b2b;--bad-bg:#fbeaea;--warn:#7a4d0a;--warn-bg:#fbf1dc;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141413;--card:#1e1e1c;--ink:#f0eee7;--muted:#a2a098;--line:#323130;--chip:#2a2a27;
  --accent:#5ccaa4;--accent-ink:#052a1e;--accent-soft:#16332a;
  --ok:#82d69c;--ok-bg:#15301d;--bad:#f29a9a;--bad-bg:#3a1919;--warn:#f0c46e;--warn-bg:#352a12;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0 2px;font-weight:650;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;font-weight:620}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:650}
.stat span{font-size:12px;color:var(--muted)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;min-height:46px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default;transform:none}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.big{width:100%;font-size:18px;min-height:54px}
.link{background:none;border:none;color:var(--accent);padding:6px 0;min-height:0}
.danger{color:var(--bad)}
.q{font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.q img,.rich img{max-width:100%;height:auto;border-radius:8px}
.qimg{margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{text-align:left;width:100%;min-height:54px;line-height:1.4;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.opt .mark{flex:0 0 22px;font-weight:700}
.opt:disabled{opacity:1}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback.sol{background:var(--chip);color:var(--ink)}
.feedback .rich{color:var(--ink)}
.expl{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:16px}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ratings button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px}
.ratings small{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:46px}
input[type=file]{font-size:15px;max-width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.deck{padding:10px 0;border-top:1px solid var(--line)}
.deck:first-of-type{border-top:none}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:0}
.toggle input{width:20px;height:20px}
.progress{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
.center{text-align:center}
.math.display{display:block;overflow-x:auto;margin:6px 0}
math{font-size:1.08em}
.missing-img{font-size:14px;color:var(--muted)}
.hidden{display:none !important}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin-top:12px}
.seg button{border:none;background:transparent;min-height:40px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.deckname{font-weight:600}
.deck button.small{min-height:36px;padding:6px 12px;font-size:15px}
label.inline{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted);font-size:14px}
label.inline select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
.row.small{gap:16px}
.cloze{color:var(--accent)}
.rich img[data-zoom]{cursor:zoom-in}
.ans .rich, .ans > div{color:var(--ink)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;cursor:zoom-out}
.lightbox img{width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="vendor/katex.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="sqlite.js"></script>
<script src="fsrs.js"></script>
<script src="anki.js"></script>
<script src="app.js"></script>
</body>
</html>
